name: CI

# 純 Markdown 變更連 workflow 都不啟動；其餘的分流交給 scopes job，
# 規則寫在 .github/scripts/changed-scopes.sh。
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scopes:
    name: 判斷變更範圍
    runs-on: ubuntu-latest
    outputs:
      tokens: ${{ steps.scopes.outputs.tokens }}
      ios: ${{ steps.scopes.outputs.ios }}
      android: ${{ steps.scopes.outputs.android }}
      web: ${{ steps.scopes.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 要比對 base 與 head，淺 clone 會找不到 merge-base
          fetch-depth: 0
      - id: scopes
        run: .github/scripts/changed-scopes.sh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  tokens:
    name: Token 是否為最新
    needs: scopes
    if: needs.scopes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: 重跑產生器
        run: node tokens/generate.mjs
      - name: 產生的檔案必須與 commit 的一致
        run: |
          if ! git diff --exit-code; then
            echo "::error::產生的 token 檔案過期了。請執行 node tokens/generate.mjs 並一起 commit。"
            exit 1
          fi

  web:
    name: Web
    needs: scopes
    if: needs.scopes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  android:
    name: Android
    needs: scopes
    if: needs.scopes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      # Kotlin 的 backtick 測試名稱會產生含中文的 class 檔名
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: 安裝 SDK 元件
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0-rc2"
      - name: Build 與測試
        working-directory: android
        run: ./gradlew :leokit:assembleRelease :leokit:test --no-daemon
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-results
          path: android/leokit/build/reports/tests/

  ios:
    name: iOS
    needs: scopes
    if: needs.scopes.outputs.ios == 'true'
    # SwiftUI + iOS 無法在 Linux 編譯，這個 job 一定要跑 macOS runner
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift 版本
        run: swift --version

      # 這個套件只支援 iOS。`swift build` 一律編給 host，在 macOS runner 上
      # 會在 `import UIKit` 爆掉；要編 iOS 只能走 xcodebuild 指定 destination。
      - name: 挑一台 iOS 模擬器
        id: sim
        run: |
          udid=$(.github/scripts/pick-ios-simulator.sh)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -F "$udid"

      - name: Build
        run: |
          xcodebuild build \
            -scheme LeoKit \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: 測試
        run: |
          xcodebuild test \
            -scheme LeoKit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
